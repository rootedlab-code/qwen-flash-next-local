# Reclaim tuning for streaming a model from SSD through mmap.
#
# Install as /etc/sysctl.d/95-large-model.conf, then:
#   sudo sysctl --system
#
# Measured effect: with the defaults, the thread that takes a page fault does
# the reclaim itself (pgscan_direct in /proc/vmstat) and blocks the other worker
# threads on futexes. Moving reclaim to the background kswapd thread took CPU
# utilisation from 381% to 498%, and that is what made 12 threads worth using
# instead of 8 (+18% throughput). Check which path is doing the work with:
#   grep -E 'pgscan_direct|pgscan_kswapd' /proc/vmstat

# Model weights are file-backed: evicting them costs a re-read we have already
# budgeted for. The KV cache is anonymous memory, and swapping *that* out is
# ruinous. A low swappiness is the right bias for this workload precisely
# because the two kinds of memory are asymmetric here.
vm.swappiness = 10

# Start background reclaim much earlier, so the fault path rarely has to.
vm.watermark_scale_factor = 200

# 256 MiB of free pages kept in reserve; page-fault storms have room to land.
vm.min_free_kbytes = 262144
